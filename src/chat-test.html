<!DOCTYPE html>
<html>

<head>
    <title>Fastify Chat Test</title>

    <style>
        body {
            font-family: Arial;
            max-width: 700px;
            margin: 40px auto;
        }

        input {
            padding: 10px;
            margin: 5px;
        }

        button {
            padding: 10px;
            margin: 5px;
            cursor: pointer;
        }

        #messages {
            border: 1px solid #ccc;
            min-height: 300px;
            padding: 15px;
            margin-top: 20px;
        }

        .message {
            padding: 8px;
            border-bottom: 1px solid #eee;
        }

        #status {
            font-weight: bold;
            margin: 10px 0;
        }
    </style>
</head>

<body>

    <h1>Fastify Chat</h1>

    <div id="status">
        Connecting...
    </div>

    <div>

        <input
            id="userId"
            type="number"
            placeholder="User ID"
        >

        <input
            id="room"
            value="general"
            placeholder="Room"
        >

        <button onclick="joinRoom()">
            Join Room
        </button>

    </div>

    <div>

        <input
            id="message"
            placeholder="Type message"
        >

        <button onclick="sendMessage()">
            Send
        </button>

    </div>

    <div id="messages"></div>


    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

    <script>

        const socket = io("http://localhost:3000");


        // ==========================================
        // CONNECTION
        // ==========================================

        socket.on("connect", () => {

            console.log(
                "Connected:",
                socket.id
            );

            document.getElementById(
                "status"
            ).textContent =
                "🟢 Connected";

        });


        socket.on("disconnect", () => {

            document.getElementById(
                "status"
            ).textContent =
                "🔴 Disconnected";

        });


        // ==========================================
        // JOIN ROOM
        // ==========================================

        function joinRoom() {

            const userId =
                Number(
                    document.getElementById(
                        "userId"
                    ).value
                );

            const room =
                document.getElementById(
                    "room"
                ).value;


            if (!userId || !room) {

                alert(
                    "Enter User ID and Room"
                );

                return;
            }


            socket.emit(
                "joinRoom",
                {
                    userId,
                    room
                }
            );

        }


        // ==========================================
        // SEND MESSAGE
        // ==========================================

        function sendMessage() {

            const userId =
                Number(
                    document.getElementById(
                        "userId"
                    ).value
                );

            const room =
                document.getElementById(
                    "room"
                ).value;

            const message =
                document.getElementById(
                    "message"
                ).value;


            if (!userId || !room || !message) {

                alert(
                    "Enter User ID, Room and Message"
                );

                return;
            }


            socket.emit(
                "sendMessage",
                {
                    userId,
                    room,
                    message
                }
            );


            document.getElementById(
                "message"
            ).value = "";

        }


        // ==========================================
        // CHAT HISTORY
        // ==========================================

        socket.on(
            "chatHistory",
            (messages) => {

                console.log(
                    "Chat history:",
                    messages
                );


                messages.forEach(
                    displayMessage
                );

            }
        );


        // ==========================================
        // NEW MESSAGE
        // ==========================================

        socket.on(
            "newMessage",
            (message) => {

                console.log(
                    "New message:",
                    message
                );


                displayMessage(message);

            }
        );


        // ==========================================
        // USER JOINED
        // ==========================================

        socket.on(
            "userJoined",
            (data) => {

                console.log(
                    "User joined:",
                    data
                );

            }
        );


        // ==========================================
        // USER LEFT
        // ==========================================

        socket.on(
            "userLeft",
            (data) => {

                console.log(
                    "User left:",
                    data
                );

            }
        );


        // ==========================================
        // CHAT ERROR
        // ==========================================

        socket.on(
            "chatError",
            (error) => {

                console.error(
                    "Chat error:",
                    error
                );

                alert(error.message);

            }
        );


        // ==========================================
        // RATE LIMIT
        // ==========================================

        socket.on(
            "chatRateLimited",
            (data) => {

                alert(
                    data.message +
                    "\nTry again in " +
                    data.retryAfter +
                    " seconds."
                );

            }
        );


        // ==========================================
        // DISPLAY MESSAGE
        // ==========================================

        function displayMessage(message) {

            const div =
                document.createElement("div");

            div.className =
                "message";


            const sender =
                message.sender_name ||
                `User ${message.sender_id}`;


            div.textContent =
                `${sender}: ${message.message}`;


            document.getElementById(
                "messages"
            ).appendChild(div);

        }

    </script>

</body>

</html>
