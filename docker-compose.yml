services:

  postgres:
    image: postgres:18
    container_name: postgres

    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: Implement123
      POSTGRES_DB: postgres_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U myuser -d postgres"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  redis:
    image: redis:latest
    container_name: redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  postgres_data:
  redis_data: